# Development only: the server stays open while the page reloads as it is edited.
#   docker compose up -d   start both. The page reloads as it is edited, and the server is built
#                          and started again whenever the Rust code changes.
# The page is at http://127.0.0.1:5173, the API at http://127.0.0.1:8080 and the printer on 9100.
services:
  backend:
    image: rust:1
    working_dir: /work
    command: sh scripts/dev-backend.sh
    restart: unless-stopped
    volumes:
      - .:/work
      - cargo:/usr/local/cargo/registry
      - target:/work/target
      - tools:/tools
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9100:9100"

  web:
    image: node:24
    working_dir: /work/web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    restart: unless-stopped
    environment:
      STUBPRINT_SERVER: http://backend:8080
      npm_config_store_dir: /pnpm-store
    volumes:
      - .:/work
      - modules:/work/web/node_modules
      - pnpm:/pnpm-store
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  cargo:
  target:
  tools:
  modules:
  pnpm:
