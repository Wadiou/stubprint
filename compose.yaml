# Development only: the server stays open while the page reloads as it is edited.
#   docker compose up -d   start both. The page reloads as it is edited, and the server is built
#                          and started again whenever the Rust code changes.
# The page is at http://127.0.0.1:5173 and the API at http://127.0.0.1:8080. They stay on this computer
# because the API has no password. The printer on 9100 is open on every address of this computer.

services:
  backend:
    build:
      context: docker
      dockerfile: backend.dev.Dockerfile
    restart: unless-stopped
    volumes:
      - .:/work
      - cargo:/usr/local/cargo/registry
      - target:/work/target
      # The database with the printers, the receipts and the connections, so they stay when the
      # container is made again.
      - state:/root/.local/state/stubprint
    ports:
      - "127.0.0.1:8080:8080"
      - "9100:9100"

  web:
    build:
      context: docker
      dockerfile: web.dev.Dockerfile
    restart: unless-stopped
    environment:
      STUBPRINT_SERVER: http://backend:8080
      npm_config_store_dir: /pnpm-store
    volumes:
      - .:/work
      - modules:/work/web/node_modules
      - pnpm:/pnpm-store
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  cargo:
  target:
  state:
  modules:
  pnpm:
