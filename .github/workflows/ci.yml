name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Libraries Pillow needs to shape Arabic in the previews
        run: sudo apt-get update && sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the fixtures, which fails when one differs from the lock
        working-directory: fixtures/generate
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt fonttools
          .venv/bin/python generate.py
          .venv/bin/python check_glyphs.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the samples
        run: |
          python -m venv samples/python/.venv
          samples/python/.venv/bin/pip install -r samples/python/requirements.txt
          npm ci --prefix samples/node
          samples/python/.venv/bin/python samples/python/build.py --no-previews
      - name: The copied upstream files are the release they say they are
        run: python3 scripts/upstream.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: The API client is the one the server describes
        working-directory: web
        run: |
          cargo build -p stubprint-server --manifest-path ../Cargo.toml
          pnpm api
          test -z "$(git status --porcelain src/api/generated)"
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: The program carries the page it was built with
        run: STUBPRINT_REQUIRE_PAGE=1 cargo test -p stubprint-server the_page_in_the_program

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
