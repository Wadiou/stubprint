[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
publish = false
license = "MIT"
authors = ["Abd El-wadoud"]
homepage = "https://stubprint.dev"
repository = "https://github.com/Wadiou/stubprint"

# Debug builds keep the lines of code for backtraces and leave out the rest of the debug
# information, which makes every test program several times smaller.
[profile.dev]
debug = "line-tables-only"
