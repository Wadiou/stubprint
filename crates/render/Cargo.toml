[package]
name = "stubprint-render"
description = "Draws a receipt as text or as a picture."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
ab_glyph = "0.2.32"
png = "0.18.1"
stubprint-core = { version = "0.0.1", path = "../core" }
rxing = { version = "0.9.3", default-features = false, features = ["encoders", "encoding_rs", "aztec", "datamatrix", "oned", "pdf417", "qrcode"] }

[dev-dependencies]
serde_json = "1.0.151"
