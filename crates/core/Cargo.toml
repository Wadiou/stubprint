[package]
name = "stubprint-core"
description = "Decodes printer command streams (ESC/POS, StarPRNT, StarLine) into a document that can be drawn."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.23.1"
encoding_rs = "0.8"
oem_cp = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6.0.0", optional = true }

[features]
# Describes the types for an OpenAPI document.
openapi = ["dep:utoipa"]

