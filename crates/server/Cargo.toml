[package]
name = "stubprint-server"
description = "A virtual receipt printer on the network: TCP ports that read printer commands, and a REST API to see what was printed."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "stubprint_server"

[[bin]]
name = "stubprint"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
stubprint-core = { path = "../core", features = ["openapi"] }
stubprint-render = { path = "../render" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
utoipa = "6.0.0"
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
